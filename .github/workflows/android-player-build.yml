name: Compilar Reproductor Android 0.1

on:
  push:
    branches: ["android-reproductor-clasico"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir proyecto Android
        run: |
          base64 --decode android-player/ReproductorClasico_0.1.tar.gz.b64 > /tmp/ReproductorClasico_0.1.tar.gz
          tar -xzf /tmp/ReproductorClasico_0.1.tar.gz

      - name: Publicar fuente reconstruida
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor_Clasico_0.1_fuente
          path: ReproductorClasico_0.1
          if-no-files-found: error

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        working-directory: ReproductorClasico_0.1
        run: gradle --no-daemon assembleDebug

      - name: Preparar entrega
        run: |
          mkdir -p entrega
          cp ReproductorClasico_0.1/app/build/outputs/apk/debug/app-debug.apk entrega/Reproductor_Clasico_0.1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor_Clasico_0.1
          path: entrega/Reproductor_Clasico_0.1.apk
          if-no-files-found: error
