name: Compilar Reproductor Android 0.3

on:
  push:
    branches: ["android-reproductor-clasico"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android-player/**"
      - ".github/workflows/android-player-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir base funcional 0.2
        run: |
          base64 --decode android-player/ReproductorClasico_0.1.tar.gz.b64 > /tmp/ReproductorClasico_0.1.tar.gz
          tar -xzf /tmp/ReproductorClasico_0.1.tar.gz
          mv ReproductorClasico_0.1 ReproductorClasico_0.2
          python3 android-player/preparar_0_2.py

      - name: Aplicar diseño RadioEnlace 0.3
        run: |
          mv ReproductorClasico_0.2 ReproductorClasico_0.3
          base64 --decode android-player/reproductor_0.3_design_overlay.tar.gz.b64 > /tmp/reproductor_0.3_design_overlay.tar.gz
          tar -xzf /tmp/reproductor_0.3_design_overlay.tar.gz -C ReproductorClasico_0.3
          sed -i "s/versionCode 2/versionCode 3/; s/versionName '0.2'/versionName '0.3'/" ReproductorClasico_0.3/app/build.gradle
          sed -i 's/Versión 0.2/Versión 0.3/g' ReproductorClasico_0.3/app/src/main/java/com/gustavobeitler/reproductorclasico/MainActivity.java
          sed -i 's/0.2/0.3/g' ReproductorClasico_0.3/README.md

      - name: Publicar fuente reconstruida 0.3
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor_Clasico_0.3_fuente
          path: ReproductorClasico_0.3
          if-no-files-found: error

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        working-directory: ReproductorClasico_0.3
        run: gradle --no-daemon assembleDebug

      - name: Preparar entrega
        run: |
          mkdir -p entrega
          cp ReproductorClasico_0.3/app/build/outputs/apk/debug/app-debug.apk entrega/Reproductor_Clasico_0.3.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor_Clasico_0.3
          path: entrega/Reproductor_Clasico_0.3.apk
          if-no-files-found: error
