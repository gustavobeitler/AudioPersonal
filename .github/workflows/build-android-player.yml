name: Build Android Player Beta 0.9

on:
  pull_request:
    paths:
      - 'AndroidSleepPlayer/**'
      - '.github/workflows/build-android-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply only Play and hardware-volume fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('AndroidSleepPlayer/direct/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 8', 'versionCode 9')
          text = text.replace("versionName '0.8'", "versionName '0.9'")
          gradle.write_text(text, encoding='utf-8')

          main = Path('AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          text = text.replace('BETA " + "0.8', 'BETA " + "0.9')
          old_play = (
              "        if (serviceBound && playbackService != null) {\n"
              "            syncBoundService();\n"
              "            playbackService.playFromClient(currentServiceIndex, currentServicePosition);\n"
              "        } else {\n"
              "            sendPlayerCommand(PlaybackService.ACTION_PLAY, currentServiceIndex);\n"
              "        }\n"
          )
          new_play = (
              "        Intent playIntent = basePlayerIntent(PlaybackService.ACTION_PLAY_INDEX);\n"
              "        playIntent.putStringArrayListExtra(PlaybackService.EXTRA_URIS, new ArrayList<>(trackUris));\n"
              "        playIntent.putStringArrayListExtra(PlaybackService.EXTRA_NAMES, new ArrayList<>(trackNames));\n"
              "        playIntent.putExtra(PlaybackService.EXTRA_INDEX, currentServiceIndex);\n"
              "        playIntent.putExtra(PlaybackService.EXTRA_RESUME_POSITION, currentServicePosition);\n"
              "        startPlaybackService(playIntent);\n"
          )
          if old_play not in text:
              raise SystemExit('No se encontró el bloque de Play')
          main.write_text(text.replace(old_play, new_play, 1), encoding='utf-8')

          service = Path('AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java')
          text = service.read_text(encoding='utf-8')
          old_listener = (
              "    private final AudioManager.OnAudioFocusChangeListener focusChangeListener = change -> {\n"
              "        if (change == AudioManager.AUDIOFOCUS_LOSS\n"
              "                || change == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {\n"
              "            pausePlayback(null);\n"
              "        }\n"
              "    };\n"
          )
          new_listener = "    private final AudioManager.OnAudioFocusChangeListener focusChangeListener = change -> { };\n"
          if old_listener not in text:
              raise SystemExit('No se encontró el listener de foco')
          text = text.replace(old_listener, new_listener, 1)
          old_focus = (
              "    private void requestAudioFocus() {\n"
              "        if (audioManager == null) return;\n"
              "        if (Build.VERSION.SDK_INT >= 26) {\n"
              "            if (focusRequest != null) audioManager.requestAudioFocus(focusRequest);\n"
              "        } else {\n"
              "            audioManager.requestAudioFocus(focusChangeListener, AudioManager.STREAM_MUSIC,\n"
              "                    AudioManager.AUDIOFOCUS_GAIN);\n"
              "        }\n"
              "    }\n"
          )
          new_focus = (
              "    private void requestAudioFocus() {\n"
              "        // La grabación de pantalla no puede devolver el reproductor a pausa.\n"
              "    }\n"
          )
          if old_focus not in text:
              raise SystemExit('No se encontró el método de foco')
          text = text.replace(old_focus, new_focus, 1)
          old_action = (
              "        if (ACTION_PLAY_INDEX.equals(action)) {\n"
              "            if (checkExpectedOutput() && !loading) startTrack(intent.getIntExtra(EXTRA_INDEX, 0));\n"
          )
          new_action = (
              "        if (ACTION_PLAY_INDEX.equals(action)) {\n"
              "            if (checkExpectedOutput() && !loading) {\n"
              "                int resume = intent.getIntExtra(EXTRA_RESUME_POSITION, 0);\n"
              "                startTrack(intent.getIntExtra(EXTRA_INDEX, 0), resume);\n"
              "            }\n"
          )
          if old_action not in text:
              raise SystemExit('No se encontró PLAY_INDEX')
          service.write_text(text.replace(old_action, new_action, 1), encoding='utf-8')
          PY

      - name: Verify requested fixes
        run: |
          grep -q "versionCode 9" AndroidSleepPlayer/direct/app/build.gradle
          grep -q "versionName '0.9'" AndroidSleepPlayer/direct/app/build.gradle
          grep -q "Intent playIntent = basePlayerIntent(PlaybackService.ACTION_PLAY_INDEX);" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java
          grep -q "change -> { };" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          grep -q "startTrack(intent.getIntExtra(EXTRA_INDEX, 0), resume);" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          grep -q "changeAppVolumeBy(keyCode == KeyEvent.KEYCODE_VOLUME_UP ? 1 : -1);" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable beta signing key
        run: base64 --decode AndroidSleepPlayer/direct/radioenlace-beta.keystore.b64 > AndroidSleepPlayer/direct/radioenlace-beta.keystore

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build clean APK
        working-directory: AndroidSleepPlayer/direct
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --stacktrace 2>&1 | tee build-beta-0.9.log

      - name: Save Beta 0.9 source
        shell: bash
        run: |
          git config user.name "RadioEnlace Build"
          git config user.email "actions@users.noreply.github.com"
          git add AndroidSleepPlayer/direct/app/build.gradle \
                  AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java \
                  AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          if ! git diff --cached --quiet; then
            git commit -m "Beta 0.9: Play directo sin pausa por foco [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Prepare APK
        run: |
          rm -rf AndroidSleepPlayer/dist
          mkdir -p AndroidSleepPlayer/dist
          cp AndroidSleepPlayer/direct/app/build/outputs/apk/debug/app-debug.apk AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.9.apk

      - name: Verify APK integrity
        run: unzip -t AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorMusica-Beta-0.9
          path: AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.9.apk
          if-no-files-found: error
