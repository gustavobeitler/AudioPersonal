name: Build Android Player Beta 0.7

on:
  pull_request:
    paths:
      - 'AndroidSleepPlayer/**'
      - '.github/workflows/build-android-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

