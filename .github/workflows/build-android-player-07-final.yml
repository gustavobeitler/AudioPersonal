          patch -p0 < /tmp/beta08.patch
          rm -f /tmp/beta08.patch /tmp/beta08.patch.gz.b64

      - name: Verify only requested changes
        run: |
          grep -q "versionCode 8" AndroidSleepPlayer/direct/app/build.gradle
          grep -q "versionName '0.8'" AndroidSleepPlayer/direct/app/build.gradle
          grep -q "focusChangeListener" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          grep -q "if (focusRequest != null) audioManager.requestAudioFocus(focusRequest);" AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          grep -q 'BETA " + "0.8' AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable beta signing key
        run: base64 --decode AndroidSleepPlayer/direct/radioenlace-beta.keystore.b64 > AndroidSleepPlayer/direct/radioenlace-beta.keystore

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build clean APK
        working-directory: AndroidSleepPlayer/direct
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --stacktrace 2>&1 | tee build-beta-0.8.log

      - name: Save Beta 0.8 source
        shell: bash
        run: |
          git config user.name "RadioEnlace Build"
          git config user.email "actions@users.noreply.github.com"
          git add AndroidSleepPlayer/direct/app/build.gradle \
                  AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java \
                  AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/PlaybackService.java
          if ! git diff --cached --quiet; then
            git commit -m "Beta 0.8: corregir Play inicial y reanudación [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Prepare APK
        run: |
          rm -rf AndroidSleepPlayer/dist
          mkdir -p AndroidSleepPlayer/dist
          cp AndroidSleepPlayer/direct/app/build/outputs/apk/debug/app-debug.apk AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.8.apk

      - name: Verify APK integrity
        run: unzip -t AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorMusica-Beta-0.8
          path: AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.8.apk
          if-no-files-found: error
