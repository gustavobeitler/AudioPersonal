name: Build Android Player Beta 0.8

on:
  pull_request:
    paths:
      - '.github/workflows/build-android-player-07-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply only the two playback fixes
        shell: bash
        run: |
          cat > /tmp/beta08.patch.gz.b64 <<'PATCH_B64'
          H4sICNFlZmoAA2JldGEwOC5wYXRjaADFV81y4jgQPm+eQpPDxBTGgIEAQzEVj3FSrgWbsk12c6IUWyHaMTYjy8xQOznMa+yL7H3z
