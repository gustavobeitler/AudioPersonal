name: Build Android Player Beta 0.10

on:
  pull_request:
    paths:
      - '.github/workflows/build-android-player-07-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify Beta 0.10 and fixed start screen
        shell: bash
        run: |
          grep -q "versionCode 10" AndroidSleepPlayer/direct/app/build.gradle
          grep -q "versionName '0.10'" AndroidSleepPlayer/direct/app/build.gradle
          grep -q 'BETA " + "0.10' AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          text = Path('AndroidSleepPlayer/direct/app/src/main/java/com/gustavo/reproductorsueno/MainActivity.java').read_text(encoding='utf-8')
          start = text.index('private View buildNowPlayingPage()')
          end = text.index('private View buildLibraryPage()', start)
          block = text[start:end]
          assert 'ScrollView' not in block
          assert 'return root;' in block
          assert 'mainPlayButton' in block
          assert 'volumeBar' in block
          assert 'fmButton' in block
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable beta signing key
        run: base64 --decode AndroidSleepPlayer/direct/radioenlace-beta.keystore.b64 > AndroidSleepPlayer/direct/radioenlace-beta.keystore

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build clean APK
        working-directory: AndroidSleepPlayer/direct
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          rm -rf AndroidSleepPlayer/dist
          mkdir -p AndroidSleepPlayer/dist
          cp AndroidSleepPlayer/direct/app/build/outputs/apk/debug/app-debug.apk AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.10.apk

      - name: Verify APK integrity
        run: unzip -t AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorMusica-Beta-0.10
          path: AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.10.apk
          if-no-files-found: error
