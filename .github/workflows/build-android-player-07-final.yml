          bLG/J/wzy2zmz1/d1HQPXLDGklaNJW031kVqNcWB7X0GciudopDw6yObrTVSvrHrXMQvgSH7B9TcmTbgFIELRq6LlDpZi9bO9Nqi
          dbEldklO+Ns2Yor2Lz/MfVuREAAA
          PATCH_B64
          tr -d '[:space:]' < /tmp/beta08.patch.gz.b64 | base64 --decode | gzip -dc > /tmp/beta08.patch
