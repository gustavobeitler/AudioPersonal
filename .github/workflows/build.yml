name: Compilar y probar

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar Audio Personal
        run: dotnet build AudioPersonal.csproj --configuration Release --property:Platform=x64

      - name: Ejecutar pruebas de voz
        shell: pwsh
        run: |
          dotnet run --project tests/VoiceLogicTest/VoiceLogicTest.csproj --configuration Release -- "${{ github.workspace }}\bin\x64\Release\net48\AudioPersonal.exe"

      - name: Preparar paquete verificable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\Audio Personal" | Out-Null
          Copy-Item bin\x64\Release\net48\AudioPersonal.exe "release\Audio Personal\"
          Copy-Item bin\x64\Release\net48\AudioPersonal.exe.config "release\Audio Personal\"
          Copy-Item bin\x64\Release\net48\NAudio.dll "release\Audio Personal\"
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md "release\Audio Personal\"
          Compress-Archive -Path "release\Audio Personal" -DestinationPath AudioPersonal-5.1-beta.zip -Force

      - name: Verificar paquete final
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("${{ github.workspace }}\AudioPersonal-5.1-beta.zip")
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            if ($names.Count -lt 6) { throw "El ZIP está incompleto." }
            if ($names | Where-Object { -not $_.StartsWith("Audio Personal/") }) { throw "Hay archivos fuera de la carpeta Audio Personal." }
            foreach ($required in @("Audio Personal/AudioPersonal.exe","Audio Personal/AudioPersonal.exe.config","Audio Personal/NAudio.dll","Audio Personal/README.md")) {
              if ($required -notin $names) { throw "Falta $required." }
            }
          }
          finally { $zip.Dispose() }

      - name: Publicar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: AudioPersonal-5.1-beta
          path: AudioPersonal-5.1-beta.zip
          if-no-files-found: error
