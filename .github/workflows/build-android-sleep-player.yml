name: Build Reproductor Sueno APK

on:
  pull_request:
    paths:
      - 'AndroidSleepPlayer/**'
      - '.github/workflows/build-android-sleep-player.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable beta signing key
        run: base64 --decode AndroidSleepPlayer/direct/radioenlace-beta.keystore.b64 > AndroidSleepPlayer/direct/radioenlace-beta.keystore

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        working-directory: AndroidSleepPlayer/direct
        run: |
          set -o pipefail
          gradle clean :app:assembleDebug --stacktrace 2>&1 | tee build-beta-0.5.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorMusica-Beta-0.5-build-log
          path: AndroidSleepPlayer/direct/build-beta-0.5.log
          if-no-files-found: error

      - name: Stop on compiler error
        if: steps.apkbuild.outcome == 'failure'
        run: exit 1

      - name: Prepare APK
        run: |
          rm -rf AndroidSleepPlayer/dist
          mkdir -p AndroidSleepPlayer/dist
          cp AndroidSleepPlayer/direct/app/build/outputs/apk/debug/app-debug.apk AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorMusica-Beta-0.5
          path: AndroidSleepPlayer/dist/ReproductorMusica_Beta_0.5.apk
          if-no-files-found: error